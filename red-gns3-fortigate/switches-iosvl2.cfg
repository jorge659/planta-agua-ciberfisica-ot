! === SW-OT (VLAN 10) ===
hostname SW-OT
vlan 10
 name ZONA_OT_CONTROL_CAMPO
interface range GigabitEthernet0/0 - 3, GigabitEthernet1/0
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast

! === SW-SUPERVISION (VLAN 30 + SPAN PORT) ===
hostname SW-SUPERVISION
vlan 30
 name ZONA_SUPERVISION_NIVEL_3
interface range GigabitEthernet0/0 - 3, GigabitEthernet1/0
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
monitor session 1 source interface GigabitEthernet0/0 - 3 both
monitor session 1 destination interface GigabitEthernet1/0

! === SW-DMZ (VLAN 35) ===
hostname SW-DMZ
vlan 35
 name ZONA_DMZ
interface range GigabitEthernet0/0 - 1
 switchport mode access
 switchport access vlan 35
 spanning-tree portfast
